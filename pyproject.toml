[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ijazahmad9dev", email = "ijazahmad9.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.1",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "google-auth>=2.57.0",
    "gspread>=6.2.1",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.15,<2.0",
    "sqlalchemy>=2.0.52",
    "sqlparse>=0.6.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
